name: Gitleaks (secrets scan)

# Detecció de secrets (claus API, tokens, contrasenyes) a canvis i
# a tot l'historial de cada push, perquè el vell accident del .env
# commitejat (commits 8c26dd7 i 25efbc6) no es repeteixi.

on:
  push:
    branches:
      - develop
      - master
      - GHPage
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historial complet: gitleaks escaneja tots els commits

      - name: Gitleaks
        # v3.0.0 fixada a SHA perquè un tag mòbil no executi codi nou.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
